; ---------------------------------------------------------------------------
; TCNewPlus – Sample Configuration
;
; Lookup order (the first file that exists is used in full — settings are
; NOT merged across files):
;
;   1. TCNewPlus.ini in the folder of Total Commander's wincmd.ini
;   2. %APPDATA%\GHISLER\TCNewPlus.ini       (per-user override)
;   3. <plugin install dir>\TCNewPlus.ini    (system-wide)
;
; In a standard installation 1 and 2 are the same file; 1 is for a portable
; or otherwise redirected Total Commander.
;
; This file is only a sample: the plugin never reads it, and an update of the
; plugin replaces it. To change settings, copy it to one of the places above
; under the name TCNewPlus.ini and edit your copy; an update leaves them
; alone.
;
; All keys are optional; every line below is commented out, so the defaults
; apply. The chosen file is re-read on every listing of the plugin root, so
; changes take effect the next time you refresh the panel (Ctrl+R).
;
; Values support Windows environment variables (for example %TEMP%,
; %LocalAppData%, %UserProfile%, %APPDATA%). They are expanded when the
; value is read.
; ---------------------------------------------------------------------------

[Templates]

; Folder containing your templates. Every file and folder inside it appears
; in the plugin's virtual file system.
;
; Default: the "Templates" folder next to the plugin DLL (a sample template
; set ships with the plugin).
;
; To share templates with the PowerToys New+ utility, point this at the
; New+ templates folder:
;
;TemplatesPath=%LocalAppData%\Microsoft\PowerToys\NewPlus\Templates

; Show an extra entry in \\\TCNewPlus that links to the physical templates
; folder — similar to the "Open templates folder" item in the PowerToys New+
; menu. Pressing Enter on it switches the panel to the real folder that is
; actually in use (the resolved TemplatesPath above, or the default).
;
; The value is the LABEL of that entry. It goes through the same naming rules
; as template files: variables are expanded ($YYYY, %USERNAME%, …) and the
; sorting prefix is hidden per [FileNames] HideStartingDigits, so you can use
; a numeric prefix to position it. The label must be a valid file name (no
; \ / : * ? " < > | characters); an invalid or empty value shows no link.
;
; Default: absent / empty — no link entry is shown.
;
;ShowLinkToTemplatesDir=999 Open templates folder

; Show the current date/time as the created/modified/accessed timestamps of the
; entries under \\\TCNewPlus, instead of the timestamps of the physical
; template files. This makes the displayed times consistent with the date and
; time substituted into names (and file contents). The templates-folder link
; entry follows the same rule (and otherwise mirrors the templates folder's
; own time).
;
; A file created by copying a template out (F5) carries the SAME timestamps it
; is shown with in the panel: the current time when this is on, otherwise the
; template file's own times.
;
; Default: 0 (off — show, and copy out with, the template files' real
; timestamps).
;
;SetTimestampsToCurrentTime=1

; Encode the template ordering into the displayed modification times, as a way
; to work around the fact that a plugin cannot impose its own sort order on
; Total Commander's panel. When on, this implies SetTimestampsToCurrentTime=1
; and additionally steps each entry's shown modification time one second
; earlier than the previous one, in the order the templates sort BY THEIR REAL
; NAME (with the sorting prefix, the same order the PowerToys New+ menu uses).
; Sort the \\\TCNewPlus panel by modification time (descending) and you get the
; order your prefixes define. The stepping is applied per directory (each
; subfolder restarts from the current time) and includes the
; ShowLinkToTemplatesDir entry.
;
; The one-second steps affect ONLY the displayed times used for sorting.
; Variable substitution in names and contents uses the listing snapshot, and
; the timestamps written to a copied-out file are governed solely by
; SetTimestampsToCurrentTime above — so with SetTimestampsToCurrentTime=0 a
; copied file keeps the template's real times even while the panel shows the
; stepped ordering times.
;
; Default: 0 (off).
;
;UseTimestampsToIndicateOrdering=1

[FileNames]

; Replace New+ variables in displayed (and therefore created) file and folder
; names: date/time patterns ($YYYY, $MM, $DD, $hh, $mm, $ss, $fff, $MMMM,
; $DDD, ...), $PARENT_FOLDER_NAME inside template subfolders, and %ENV_VAR%
; environment variables. See README.md for the full variable table.
;
; Default: 1 (enabled). Set to 0 to show template names verbatim.
;
;ReplaceFilenameVariables=0

; Hide the sorting prefix — leading digits, spaces and dots that control the
; ordering of templates ("1. Letter.docx" is shown and copied as
; "Letter.docx").
;
; Default: 1 (enabled). Set to 0 to keep prefixes; the panel then sorts the
; templates by prefix, but copies created with F5 keep the prefix in their
; filename too.
;
;HideStartingDigits=0

[FileContents]

; Replace New+ variables INSIDE the file contents (not just in the name) when
; a template is copied out. This is an extension beyond PowerToys New+, which
; only substitutes variables in filenames.
;
; The value is a comma-separated list of file extensions for which in-content
; expansion is performed; files with any other extension are copied byte for
; byte. This opt-in-by-extension design avoids corrupting binary files — we
; never guess whether a file is text. The same variables as in names are
; supported ($YYYY, $hh, $PARENT_FOLDER_NAME, %USERNAME%, …), except that
; characters invalid in filenames are NOT replaced with spaces inside content
; (so a path from %USERPROFILE% stays intact). $PARENT_FOLDER_NAME expands to
; the name of the containing template subfolder (empty at the root). The date,
; time and environment values come from the moment the directory was listed —
; the same instant used for the file's name — so a variable resolves to the
; same value in the name and in the contents (refresh with Ctrl+R to update).
;
; Listed files are assumed to be UTF-8 (a leading byte-order mark is
; preserved); a file that is not valid UTF-8 is copied verbatim instead.
;
; Default: empty (no in-content expansion). Uncomment to enable for the
; given extensions:
;
;ReplaceContentVariables=.md,.txt
