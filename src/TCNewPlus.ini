; ---------------------------------------------------------------------------
; TCNewPlus – Sample Configuration
;
; Lookup order (the first file that exists is used in full — settings are
; NOT merged across files):
;
;   1. %APPDATA%\GHISLER\TCNewPlus.ini       (per-user override)
;   2. <plugin install dir>\TCNewPlus.ini    (system-wide; ships with the
;                                             plugin, this is that file)
;
; To override settings just for your user account, copy this file to
;   %APPDATA%\GHISLER\TCNewPlus.ini
; and edit your copy. The system-wide file will then be ignored entirely.
;
; All keys are optional; every line below is commented out, so the defaults
; apply. The chosen file is re-read on every listing of the plugin root, so
; changes take effect the next time you refresh the panel (Ctrl+R).
;
; Values support Windows environment variables (for example %TEMP%,
; %LocalAppData%, %UserProfile%, %APPDATA%). They are expanded when the
; value is read.
; ---------------------------------------------------------------------------

[TCNewPlus]

; Folder containing your templates. Every file and folder inside it appears
; in the plugin's virtual file system.
;
; Default: the "Templates" folder next to the plugin DLL (a sample template
; set ships with the plugin).
;
; To share templates with the PowerToys New+ utility, point this at the
; New+ templates folder:
;
;TemplatesPath=%LocalAppData%\Microsoft\PowerToys\NewPlus\Templates

; Replace New+ variables in displayed (and therefore created) names:
; date/time patterns ($YYYY, $MM, $DD, $hh, $mm, $ss, $fff, $MMMM, $DDD, ...),
; $PARENT_FOLDER_NAME inside template subfolders, and %ENV_VAR% environment
; variables. See README.md for the full variable table.
;
; Default: 1 (enabled). Set to 0 to show template names verbatim.
;
;ReplaceVariables=0

; Hide the sorting prefix — leading digits, spaces and dots that control the
; ordering of templates ("1. Letter.docx" is shown and copied as
; "Letter.docx").
;
; Default: 1 (enabled). Set to 0 to keep prefixes; the panel then sorts the
; templates by prefix, but copies created with F5 keep the prefix in their
; filename too.
;
;HideStartingDigits=0
